backend:
  name: github
  repo: Supernerd12/supernerd-tv
  branch: main

media_folder: "public/work/uploads"
public_folder: "/work/uploads"

media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: work
    label: "Work — Projects"
    label_singular: "Project"
    identifier_field: title
    folder: "src/content/work"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    summary: "{{title}}  ·  order {{order}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: "Project name", widget: string }
      - { name: order, label: "Sort order (lower shows first)", widget: number, value_type: int, default: 100 }
      - { name: published, label: "Published — show on the site", widget: boolean, default: true, required: false }
      - name: categories
        label: Categories
        widget: select
        multiple: true
        options: [Art Direction, Motion Design, TV Show, Branding, Live Experience, Touring, Invite, Print, Creative Production, Podcast, Award Design, Website, Fashion Design, Storyboarding, Commercials]
      - { name: hero, label: "Project header image (shown on the card)", widget: image, required: false }
      - { name: description, label: "Project description (optional)", widget: text, required: false }
      - name: pieces
        label: "Pieces (each is a button inside the project)"
        label_singular: "Piece"
        widget: list
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: "Piece title", widget: string }
          - { name: published, label: "Published — show this piece", widget: boolean, default: true, required: false }
          - { name: hero, label: "Piece image / thumbnail", widget: image, required: false }
          - { name: video, label: "Video link — Cloudflare Stream URL (optional)", widget: string, required: false }
          - { name: no_video, label: "No video — static piece (gallery only)", widget: boolean, default: false, required: false }
          - { name: description, label: "Description", widget: text, required: false }
          - name: gallery
            label: "Image gallery (scrolling carousel)"
            widget: list
            required: false
            field: { name: image, label: Image, widget: image }

  # ===================== CLIENT REVIEW PORTAL =====================
  - name: reviews
    label: "Reviews — Clients"
    label_singular: "Review (Client)"
    identifier_field: name
    folder: "src/content/reviews"
    extension: json
    format: json
    create: true
    slug: "{{fields.key}}"
    summary: "{{name}}  ·  /r/{{url_slug}}/"
    fields:
      - { name: name, label: "Client / company name (shown to them)", widget: string }
      - { name: key, label: "Short id — lowercase, no spaces (e.g. trrp). Don't change after going live.", widget: string, pattern: ['^[a-z0-9-]+$', 'lowercase letters, numbers, dashes only'] }
      - { name: url_slug, label: "Secret link slug — the page is /r/<this>/ . Make it unguessable.", widget: string, pattern: ['^[a-z0-9-]+$', 'lowercase letters, numbers, dashes only'] }
      - { name: logo, label: "Client logo (optional)", widget: image, required: false }
      - { name: published, label: "Published — live", widget: boolean, default: true, required: false }

  - name: reviewProjects
    label: "Reviews — Projects"
    label_singular: "Project"
    identifier_field: title
    folder: "src/content/reviewProjects"
    extension: json
    format: json
    create: true
    slug: "{{fields.key}}"
    summary: "{{title}}  ·  {{company_key}}"
    sortable_fields: [order, title]
    fields:
      - name: company_key
        label: "Client (which Review this project belongs to)"
        widget: relation
        collection: reviews
        value_field: key
        search_fields: [name]
        display_fields: [name]
      - { name: title, label: "Project title (e.g. Animated PSA)", widget: string }
      - { name: key, label: "Short id — lowercase (e.g. animated-psa). Don't change after going live.", widget: string, pattern: ['^[a-z0-9-]+$', 'lowercase letters, numbers, dashes only'] }
      - { name: tagline, label: "Tagline (optional, shown on the project card)", widget: string, required: false }
      - { name: order, label: "Sort order (lower shows first)", widget: number, value_type: int, default: 100, required: false }
      - { name: published, label: "Published — show this project", widget: boolean, default: true, required: false }

  - name: reviewItems
    label: "Reviews — Items (deliverables)"
    label_singular: "Item"
    identifier_field: title
    folder: "src/content/reviewItems"
    extension: json
    format: json
    create: true
    slug: "{{fields.section}}-{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    summary: "{{section}}  ·  {{title}} {{version}}"
    sortable_fields: [order, title]
    fields:
      - name: project_key
        label: "Project"
        widget: relation
        collection: reviewProjects
        value_field: key
        search_fields: [title]
        display_fields: [title]
      - { name: section, label: "Section — just TYPE it (Style Frames, Assets, Storyboards, Videos, Audio, Client Files...). Same spelling = same section.", widget: string }
      - { name: title, label: "Title / name — KEEP IT THE SAME across versions (e.g. Dr.Patel). Same title = same item, new version.", widget: string }
      - { name: version, label: "Version (e.g. v2) — items with the SAME Title stack as versions; newest shows on top", widget: string, required: false }
      - { name: image, label: "Image — upload (for images / boards / frames)", widget: image, required: false }
      - { name: stream_uid, label: "Cloudflare Stream video ID (for videos)", widget: string, required: false }
      - { name: src_url, label: "File / image / audio URL (for anything hosted elsewhere; Dropbox: end with ?raw=1)", widget: string, required: false }
      - { name: download_url, label: "Download link (optional) — leave blank to auto-use the media above", widget: string, required: false }
      - { name: order, label: "Sort order within the section (lower first)", widget: number, value_type: int, default: 100, required: false }
      - { name: published, label: "Published — show this item (uncheck to fully hide)", widget: boolean, default: true, required: false }
